<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Points Display | GUDLFT</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f5f5f5; 
            color: #333; 
            margin: 20px;
        }
        h2 { 
            color: #555; 
            border-bottom: 2px solid #ddd; 
            padding-bottom: 10px;
        }
        table { 
            border-collapse: collapse; 
            width: 100%; 
            max-width: 600px;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        th, td { 
            border: 1px solid #ccc; 
            padding: 12px; 
            text-align: left; 
        }
        th { 
            background-color: #e0e0e0; 
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .nav-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            background-color: #ddd;
            color: #333;
            text-decoration: none;
            border-radius: 4px;
        }
        .nav-link:hover {
            background-color: #ccc;
        }
    </style>
</head>
<body>
    <h2>Club Points Display</h2>
    <p><em>Current points for all registered clubs</em></p>
    
    <table>
        <thead>
            <tr>
                <th>Club Name</th>
                <th>Points Available</th>
            </tr>
        </thead>
        <tbody>
            {% for club in clubs %}
            <tr>
                <td>{{club['name']}}</td>
                <td>{{club['points']}}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    
    <a href="{{ url_for('index') }}" class="nav-link">← Back to Home</a>
</body>
</html>
